---
# control
control:
  fed: '1'
  num_users: '100'
  frac: '0.1'
  data_split_mode: 'iid'
  model_split_mode: 'fix'
  model_mode: 'a1'
  norm: 'bn'
  scale: '1'
  mask: '1'
# data
data_name: CIFAR10
subset: label
batch_size:
  train: 128
  test: 128
shuffle:
  train: False
  test: False
num_workers: 0
model_name: fcnn
metric_name:
  train:
    - Loss
    - Accuracy
  test:
    - Loss
    - Accuracy
# optimizer
optimizer_name: Adam
lr: 3.0e-4
momentum: 0.9
weight_decay: 5.0e-4
# scheduler
scheduler_name: None
step_size: 1
milestones:
  - 100
  - 150
patience: 10
threshold: 1.0e-3
factor: 0.5
min_lr: 1.0e-4
# experiment
init_seed: 2
num_experiments: 1
num_epochs: 1
log_interval: 0.25
device: cuda
world_size: 1
resume_mode: 0
# other
save_format: pdf

# prototype-2 defense
round_log_dir: output/round_log/prototype2
validation_response: zero_change
verifier_val_size : 32
verifier_max_loss_increase : 0.05
verifier_max_acc_drop : 10.0
verifier_min_relative_change : 1.0e-5
verifier_max_relative_change : 0.6
verifier_min_behavior_loss_delta : 0.0003
verifier_min_behavior_acc_delta : 1.0e-9
verifier_behavior_freeze_min_relative_change : 0.02
verifier_structure_warmup_rounds : 2

# replay-commit attack / prototype-2 debug
attack_commit_enabled: true
attack_source_round: 3
attack_replay_round: 4
attack_commit_noise_scale: 0.0
attack_model_mode: hybrid_trap
# options:
#   real_replay
#   hybrid_trap
debug_hybrid_trap: true

# what to do if the replay candidate is rejected
# options: rollback_previous, fallback_honest, abort
commit_rejection_response: rollback_previous

# terminal debug
debug_commitment: true
debug_extraction: true
debug_attack_replay: true
