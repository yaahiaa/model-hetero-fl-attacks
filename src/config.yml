---
# control
control:
  fed: '1'
  num_users: '100'
  frac: '0.1'
  data_split_mode: 'iid'
  model_split_mode: 'fix'
  model_mode: 'a1'
  norm: 'bn'
  scale: '1'
  mask: '1'
# data
data_name: CIFAR10
subset: label
batch_size:
  train: 128
  test: 128
shuffle:
  train: False
  test: False
num_workers: 0
model_name: fcnn
metric_name:
  train:
    - Loss
    - Accuracy
  test:
    - Loss
    - Accuracy
# optimizer
optimizer_name: Adam
lr: 3.0e-4
momentum: 0.9
weight_decay: 5.0e-4
# scheduler
scheduler_name: None
step_size: 1
milestones:
  - 100
  - 150
patience: 10
threshold: 1.0e-3
factor: 0.5
min_lr: 1.0e-4
# experiment
experiment_method: unknown
experiment_id: default
results_dir: results
leakage_results_csv: "{results_dir}/leakage_raw.csv"
epoch_results_csv: "{results_dir}/epoch_raw.csv"
overhead_results_csv: "{results_dir}/overhead_raw.csv"
enable_experiment_logging: true
attack_noise_amount: 0.0
attack_blocked_zero_metrics: true
recovered_pearson_threshold: 0.98
convergence_mode: false
disable_attack_for_convergence: false
init_seed: 2
num_experiments: 1
num_epochs: 1
log_interval: 0.25
device: cuda
world_size: 1
resume_mode: 0
# other
save_format: pdf

# -------------------------------------------------------------------------
# Prototype4: RMA replay flow
# -------------------------------------------------------------------------
attack_source_round: 3
attack_replay_round: 4
attack_replay_enabled: true
attack_model_mode: hybrid_trap
# options:
#   real_replay
#   hybrid_trap
debug_attack_replay: true
debug_hybrid_trap: true

# -------------------------------------------------------------------------
# DP defense mode
# -------------------------------------------------------------------------
dp_mode: distributed
# options: none, local, distributed

# Local DP, legacy/local baseline
local_dp_enabled: false
ldp_clip_norm: 1.0
ldp_noise_multiplier: 0.005
debug_local_dp: false

# Distributed DP simulation
# Each client clips its local update and adds a noise share.
# If k clients are active, sigma_client = sqrt(k) * sigma_total,
# where sigma_total = ddp_noise_multiplier * ddp_clip_norm.
ddp_enabled: true
ddp_clip_norm: 1.0
ddp_noise_multiplier: 0.005
ddp_debug: true
ddp_use_shared_total_noise: true
